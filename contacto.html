<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="icon" href="assets/images/Logo%20negro.png"><link rel="stylesheet" href="styles.css"></head>
<body data-page="contacto">
<main>
<section class="pagehead sandbg" style="min-height:100vh">
 <span class="fl" data-s="30" style="top:22%;right:6%;width:110px"><img src="assets/images/caracol.png" alt=""></span>
 <span class="fl x" data-s="-30" style="bottom:8%;left:4%;width:90px"><img src="assets/images/copa2.png" alt=""></span>
 <div class="wrap split">
  <div><h1 data-split>Hablemos de tu marca.</h1><p class="lead" style="margin-top:1.5rem">Contanos tu idea y empezamos a darle forma.</p>
   <p style="margin-top:2.5rem">Escribinos a</p><a href="mailto:squidstudio.contacto@gmail.com" class="mail">squidstudio.contacto@gmail.com</a>

  <form name="contact" method="POST" data-netlify="true" class="cform rv"><input type="hidden" name="form-name" value="contact">

 </div>
</section>
</main>
